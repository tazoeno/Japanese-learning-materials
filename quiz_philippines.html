<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🇵🇭 Philippines Culture Quiz</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(135deg, #e3f2fd 0%, #fffde7 50%, #fce4ec 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .card {
    background: white; border-radius: 24px; padding: 28px 24px;
    max-width: 480px; width: 100%;
    box-shadow: 0 8px 32px rgba(0,100,200,0.12);
  }
  .header { text-align: center; margin-bottom: 20px; }
  .header .emoji { font-size: 48px; }
  .header h1 { font-size: 22px; color: #1565c0; font-weight: 800; margin-top: 6px; }
  .header .subtitle { font-size: 13px; color: #999; margin-top: 4px; }
  .progress-bar { background: #e3f2fd; border-radius: 99px; height: 8px; margin-bottom: 20px; overflow: hidden; }
  .progress-fill { background: linear-gradient(90deg, #1565c0, #42a5f5); height: 100%; border-radius: 99px; transition: width 0.4s ease; }
  .q-counter { text-align: right; font-size: 12px; color: #bbb; margin-bottom: 8px; }
  .question { font-size: 18px; font-weight: 700; color: #1a237e; margin-bottom: 20px; line-height: 1.5; min-height: 60px; }
  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    background: #e3f2fd; border: 2px solid #90caf9; border-radius: 14px;
    padding: 14px 16px; font-size: 15px; color: #1a237e;
    cursor: pointer; transition: all 0.2s; text-align: left;
  }
  .option:hover { background: #bbdefb; border-color: #1565c0; transform: translateY(-1px); }
  .option.correct { background: #d4f7e8; border-color: #2ecc71; color: #1a7a45; }
  .option.wrong { background: #fde8e8; border-color: #e74c3c; color: #c0392b; }
  .option.disabled { cursor: default; transform: none; }
  .feedback { margin-top: 16px; padding: 12px 16px; border-radius: 12px; font-size: 14px; font-weight: 600; display: none; }
  .feedback.show { display: block; }
  .feedback.correct { background: #d4f7e8; color: #1a7a45; }
  .feedback.wrong { background: #fde8e8; color: #c0392b; }
  .next-btn {
    margin-top: 16px; width: 100%;
    background: linear-gradient(135deg, #1565c0, #1976d2);
    color: white; border: none; border-radius: 14px;
    padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; display: none; transition: transform 0.15s;
  }
  .next-btn:hover { transform: translateY(-2px); }
  .next-btn.show { display: block; }
  .result { text-align: center; display: none; padding: 10px 0; }
  .result.show { display: block; }
  .result .big-emoji { font-size: 64px; margin-bottom: 12px; }
  .result h2 { font-size: 24px; color: #1565c0; font-weight: 800; }
  .result .score { font-size: 40px; font-weight: 900; color: #1a237e; margin: 10px 0; }
  .result .msg { font-size: 15px; color: #666; margin-bottom: 20px; line-height: 1.6; }
  .restart-btn { background: linear-gradient(135deg, #1565c0, #1976d2); color: white; border: none; border-radius: 14px; padding: 14px 32px; font-size: 16px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div class="emoji">🇵🇭</div>
    <h1>Philippines Culture Quiz</h1>
    <div class="subtitle">How much do you know about the Philippines?</div>
  </div>

  <div class="quiz-area" id="quizArea">
    <div class="q-counter" id="qCounter">Question 1 / 5</div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    <div class="question" id="questionText"></div>
    <div class="options" id="optionsContainer"></div>
    <div class="feedback" id="feedback"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">Next →</button>
  </div>

  <div class="result" id="result">
    <div class="big-emoji" id="resultEmoji"></div>
    <h2>Your Score</h2>
    <div class="score" id="scoreText"></div>
    <div class="msg" id="resultMsg"></div>
    <button class="restart-btn" onclick="restartQuiz()">🔄 Try Again!</button>
  </div>
</div>

<script>
const questions = [
  {
    q: "🏙️ What is the capital city of the Philippines?",
    options: ["Cebu", "Davao", "Manila", "Quezon City"],
    answer: 2,
    explanation: "Manila is the capital of the Philippines! It's one of the most densely populated cities in the world and sits on the shores of Manila Bay. 🌊"
  },
  {
    q: "🍚 Adobo is the most famous Filipino dish. What is it?",
    options: ["A sweet rice cake", "Meat marinated in vinegar and soy sauce", "A spicy noodle soup", "Grilled fish on a skewer"],
    answer: 1,
    explanation: "Filipino adobo is meat (usually chicken or pork) cooked in vinegar, soy sauce, garlic, and bay leaves. The vinegar helps preserve it in the tropical heat — smart cooking! 🍗"
  },
  {
    q: "🏝️ The Philippines is an archipelago. Approximately how many islands does it have?",
    options: ["Around 1,000", "Around 3,500", "Around 7,000", "Around 15,000"],
    answer: 2,
    explanation: "The Philippines has around 7,641 islands! Only about 2,000 are inhabited. This makes it one of the largest archipelagos in the world. 🗺️"
  },
  {
    q: "🐟 The Philippine Eagle is the national bird. What is special about it?",
    options: ["It can swim underwater", "It is one of the largest eagles in the world", "It can mimic human voices", "It only comes out at night"],
    answer: 1,
    explanation: "The Philippine Eagle is one of the largest, most powerful eagles in the world! It can have a wingspan of up to 2 meters. Sadly, it is critically endangered. 🦅"
  },
  {
    q: "🎉 What is the colourful festival in the Philippines where people throw buckets of water at each other?",
    options: ["Sinulog Festival", "Pahiyas Festival", "Ati-Atihan Festival", "Pista ng Higantes"],
    answer: 0,
    explanation: "Wait — actually the water festival is Sinulog in Cebu, but also the Kadayawan! Sinulog is famous for its street dance honouring the Santo Niño. Fun fact: Filipinos also celebrate water festivals during Paskuhan! 🌊🎊"
  }
];

let current = 0, score = 0, answered = false;

function loadQuestion() {
  answered = false;
  const q = questions[current];
  document.getElementById('qCounter').textContent = `Question ${current + 1} / ${questions.length}`;
  document.getElementById('progressFill').style.width = `${(current / questions.length) * 100}%`;
  document.getElementById('questionText').textContent = q.q;
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('nextBtn').className = 'next-btn';
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';
  q.options.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.onclick = () => selectAnswer(i);
    container.appendChild(btn);
  });
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const q = questions[current];
  document.querySelectorAll('.option').forEach(o => o.classList.add('disabled'));
  document.querySelectorAll('.option')[idx].classList.add(idx === q.answer ? 'correct' : 'wrong');
  document.querySelectorAll('.option')[q.answer].classList.add('correct');
  const fb = document.getElementById('feedback');
  if (idx === q.answer) { score++; fb.className = 'feedback correct show'; fb.textContent = '✅ Correct! ' + q.explanation; }
  else { fb.className = 'feedback wrong show'; fb.textContent = '❌ Not quite! ' + q.explanation; }
  document.getElementById('nextBtn').className = 'next-btn show';
}

function nextQuestion() {
  current++;
  if (current >= questions.length) showResult();
  else loadQuestion();
}

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  document.getElementById('result').className = 'result show';
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('scoreText').textContent = `${score} / ${questions.length}`;
  const msgs = [
    { emoji: '😢', msg: 'There is so much to discover about the Philippines! 7,000+ islands await! 🏝️' },
    { emoji: '🙂', msg: 'Good effort! The Philippines is an amazing country — learn more! 🌺' },
    { emoji: '😄', msg: 'Nice score! You know the Philippines quite well! 🦅' },
    { emoji: '🌟', msg: 'Great job! You really know your Philippine culture! Mabuhay! 🎉' },
    { emoji: '🏆', msg: 'PERFECT! You are an honorary Filipino! Salamat po! 🇵🇭✨' },
  ];
  const level = score <= 1 ? 0 : score === 2 ? 1 : score === 3 ? 2 : score === 4 ? 3 : 4;
  document.getElementById('resultEmoji').textContent = msgs[level].emoji;
  document.getElementById('resultMsg').textContent = msgs[level].msg;
}

function restartQuiz() {
  current = 0; score = 0;
  document.getElementById('quizArea').style.display = 'block';
  document.getElementById('result').className = 'result';
  loadQuestion();
}

loadQuestion();
</script>
</body>
</html>
