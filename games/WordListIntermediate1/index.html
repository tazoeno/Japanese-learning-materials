  <script>
    const words = JSON.parse(document.getElementById("word-data").textContent);

    
    
    
    
    function populateBookFilter() {
      const bookSelect = document.getElementById("bookFilter");
      const uniqueBooks = Array.from(new Set(words.map(w => w.book).filter(Boolean)));
      const order = ["中級1","初中級","初級2かつどう","初級1かつどう","入門かつどう"];
      const ordered = order.filter(b => uniqueBooks.includes(b));
      bookSelect.innerHTML = "";
      const optAll = document.createElement("option");
      optAll.value = "";
      optAll.textContent = "すべて";
      bookSelect.appendChild(optAll);
      ordered.forEach(b => {
        const opt = document.createElement("option");
        opt.value = b;
        opt.textContent = b;
        bookSelect.appendChild(opt);
      });
    }


    function filterWords() {
      const query = document.getElementById("search").value.trim().toLowerCase();
      const selectedLesson = document.getElementById("lessonFilter").value;
      const selectedBook = document.getElementById("bookFilter").value;

      let filtered = words.filter(word => {
        const matchQuery =
          word.japanese.includes(query) ||
          word.english.toLowerCase().includes(query);

        const matchLesson = selectedLesson === "" || String(word.lesson) === selectedLesson;
        const matchBook = selectedBook === "" || word.book === selectedBook;

        return matchQuery && matchLesson && matchBook;
      });

      displayResults(filtered);
    }

    function displayResults(data) {
      const resultDiv = document.getElementById("results");
      resultDiv.innerHTML = "";
      if (data.length === 0) {
        resultDiv.innerHTML = "<p>一致する単語が見つかりませんでした。</p>";
        return;
      }
      data.forEach(word => {
        const div = document.createElement("div");
        div.className = "word";
        div.innerHTML = `
          <span><strong>日：</strong>${word.japanese}</span>
          <span><strong>英：</strong>${word.english}</span>
          <span><strong>課：</strong>${word.lesson}</span>
          <span><strong>Book：</strong>${word.book}</span>
        `;
        resultDiv.appendChild(div);
      });
    }

    // 初期表示
    populateBookFilter();
    filterWords();
  </script>

<script>
  // 追加: Book セレクトをデータから動的生成（未設定なら）
  (function initBookOptions(){
    const raw = document.getElementById('word-data').textContent.trim();
    let data = [];
    try { data = JSON.parse(raw); } catch(e){ console.error(e); }
    const bookSel = document.getElementById('bookFilter');
    if (!bookSel) return;
    if (bookSel.options.length === 0) {
      const books = Array.from(new Set(data.map(x => x.book))).filter(Boolean);
      const frag = document.createDocumentFragment();
      const all = document.createElement('option');
      all.value = ''; all.textContent = 'すべて';
      frag.appendChild(all);
      books.forEach(b => {
        const opt = document.createElement('option');
        opt.value = b; opt.textContent = b;
        frag.appendChild(opt);
      });
      bookSel.appendChild(frag);
    }
  })();

  function filterWords(){
    const q = (document.getElementById('search')?.value || '').trim().toLowerCase();
    const lesson = document.getElementById('lessonFilter')?.value || '';
    const book = '';
    const part = document.getElementById('partFilter')?.value || '';
    const sortBy = '';
    const raw = document.getElementById('word-data').textContent.trim();
    let data = [];
    try { data = JSON.parse(raw); } catch(e){ console.error(e); }

    // 正規化：part/lesson を数値に
    data = data.map(d => ({
      ...d,
      lesson: typeof d.lesson === 'string' ? parseInt(d.lesson, 10) : d.lesson,
      part: typeof d.part === 'string' ? parseInt(d.part, 10) : d.part
    }));

    let filtered = data.filter(item => {
      const hitQ = !q || (String(item.japanese || '').toLowerCase().includes(q) || String(item.english || '').toLowerCase().includes(q));
      const hitLesson = !lesson || String(item.lesson) === String(lesson);
      const hitBook = !book || String(item.book) === String(book);
      const hitPart = !part || String(item.part) === String(part);
      return hitQ && hitLesson && hitBook && hitPart;
    });

        // レンダリング
    const $results = document.getElementById('results');
    $results.innerHTML = '';
    if (filtered.length === 0){
      $results.innerHTML = '<p style="text-align:center;color:#555;">該当なし</p>';
      return;
    }
    const frag = document.createDocumentFragment();
    filtered.forEach(item => {
      const div = document.createElement('div');
      div.className = 'word';
      const jp = `<span><strong>${item.japanese ?? ''}</strong></span>`;
      const en = `<span>${item.english ?? ''}</span>`;
      const meta = `<span>Book: ${item.book ?? ''}</span><span>課: ${item.lesson ?? ''}</span><span>Part: ${item.part ?? ''}</span>`;
      div.innerHTML = jp + en + meta;
      frag.appendChild(div);
    });
    $results.appendChild(frag);
  }

  // 初期描画
  document.addEventListener('DOMContentLoaded', filterWords);
</script>
